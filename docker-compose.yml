name: pf-privilege-obo-lab

services:
  pf-privilege-obo-lab:
    build: .
    image: pf-privilege-obo-lab:latest
    container_name: pf-privilege-obo-lab
    ports:
      - "127.0.0.1:${HOST_PORT:-7812}:7812"
    # Real mode settings live in this lab's own .env beside this file (see .env.example). Optional: Mock needs none.
    env_file:
      - path: .env
        required: false
    environment:
      # Run observability (rule 27), Real mode only. A loopback Elasticsearch URL and a READ-ONLY key; empty = the Real record says
      # "unreachable" and names what to set. Never mount the Docker socket here.
      - RUN_OBS_ES_URL=${RUN_OBS_ES_URL:-}
      - RUN_OBS_ES_READ_APIKEY=${RUN_OBS_ES_READ_APIKEY:-}
      - PORT=7812
      - BIND_ALL=1
      - LAB_ALLOWED_HOSTS=localhost:7812,127.0.0.1:7812,pf-privilege-obo-lab.local.ping-devops.com:7812,pf-privilege-obo-lab:7812,pf-privilege-obo-lab.local.ping-devops.com:8443,local.ping-devops.com:8443
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
